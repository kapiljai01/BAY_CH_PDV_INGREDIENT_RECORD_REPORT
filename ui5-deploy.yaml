# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: ingredientrp
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: CH_ERP_PLD
          url: http://pld.pp.virtual:443
          client: '300'
        app:
          name: /BAY0/AB_RP_INGRD
          description: Report Ingredient Where used List
          package: /BAY0/AB_REPORTING_HUB
          transport: PLDK910148
        exclude:
          - /test/
          - /localService/
